<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Temas</title>
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <main class="contenedor" id="tema">
        <h1>Tienda Nova</h1>
        <p>Selecciona un tema para cambiar la apariencia.</p>
<div class="botones" >
            <button id="azul">Azul</button>
            <button id="guinda">Guinda</button>
            <button id="verde">Verde</button>
            <button id="amarillo">Amarillo</button>
            <button id="rosa">Rosado</button>
        </div>
        <p id="tema-actual">Tema Actual:</p>
        <section class="tarjeta">
            <h2>Producto destacado</h2>
            <p>Laptop profesional para estudiantes de Diseño y Programación Web.</p>
            <strong>S/ 2,899</strong>
            <br><br>
            <button>Comprar</button>
        </section>
        <section class="tarjeta">
            <h2>Producto destacado</h2> 
            <p>Reloj Inteligente que monitorea tu salud</p>
            <strong>S/ 600</strong>
            <br><br>
            <button>Comprar</button>
        </section>
    </main>
    <script src="./Js/app.js"></script>
</body>
</html>
