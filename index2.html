<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Temas</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Tienda Nova</h1>
        <p>Selecciona un tema para cambiar la apariencia.</p>
        <div class="botones">
            <button id="azul">Azul</button>
            <button id="guinda">Guinda</button>
            <button id="verde">Verde</button>
            <button id="amarillo">Amarillo</button>
        </div>
        <section class="tarjeta">
            <h2>Producto destacado</h2>
            <p>Laptop profesional para estudiantes de Diseño y Programación Web.</p>
            <strong>S/ 2,899</strong>
            <br><br>
            <button>Comprar</button>
        </section>
        <section class="tarjeta">
            <h2>Impresora</h2>
            <p>Imprime tus trabajos, rápido y fácil.</p>
            <strong>s/1,200</strong>
            <br><br>
            <button>Comprar</button>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
